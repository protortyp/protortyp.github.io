{% raw %}
<style>
  .chart-hs-kyiv {
    margin: 1.5rem 0;
    color: var(--text-color, currentColor);
  }
  .chart-hs-kyiv svg { max-width: 100%; height: auto; background: transparent; }
  .chart-hs-kyiv .legend {
    display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; margin: 0.5rem 0; font-size: 0.82rem;
  }
  .chart-hs-kyiv .legend-swatch {
    display: inline-block; width: 16px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px;
  }
  .chart-hs-kyiv .caption { font-size: 0.8rem; opacity: 0.6; margin-top: 0.5rem; }
</style>

<div class="chart-hs-kyiv">
  <div id="hs-kyiv-chart"></div>

  <div class="legend">
    <span><span class="legend-swatch" style="background:#7dd3c0"></span>Intercepted</span>
    <span><span class="legend-swatch" style="background:#c97c5d"></span>Got through</span>
  </div>

  <div class="caption">
    Each bar is one night's launches, normalised to 100%. Teal is the
    share intercepted. The defence holds against the slow and the
    numerous, and falls away against everything fast.
  </div>
</div>

<script type="module">
  const Plot = await import("https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/+esm");
  const PAL  = window.HSPal;
  const ORANGE = '#c97c5d';

  const rows = [
    { cat: 'Shahed-type drones',                   launched: 600, intercepted: 549 },
    { cat: 'Kalibr / Kh-101 / Iskander-K cruise',  launched: 54,  intercepted: 49  },
    { cat: 'Iskander-M / S-400 ballistic',         launched: 30,  intercepted: 4   },
    { cat: 'Zircon (scramjet HCM)',                launched: 3,   intercepted: 1   },
    { cat: 'Kinzhal (aeroballistic)',              launched: 2,   intercepted: 1   },
    { cat: 'Oreshnik (IRBM, MIRV)',                launched: 1,   intercepted: 0   },
  ];

  // Normalise each row to a share of its own launches, so the teal
  // length reads directly as the interception rate.
  const data = [];
  for (const r of rows) {
    const rate = r.intercepted / r.launched;
    data.push({ cat: r.cat, kind: 'Intercepted', frac: rate });
    data.push({ cat: r.cat, kind: 'Got through',  frac: 1 - rate });
  }

  const labels = rows.map(r => ({
    cat: r.cat,
    txt: r.launched.toLocaleString() + ' launched, ' +
         (r.intercepted / r.launched * 100).toFixed(0) + '% intercepted'
  }));

  function draw() {
    const chart = Plot.plot({
      height: 280,
      marginLeft: 220,
      marginRight: 270,
      marginBottom: 38,
      style: { background: 'transparent', color: 'currentColor', fontFamily: 'inherit', fontSize: '11px' },
      x: {
        domain: [0, 1],
        label: null,
        grid: true,
        ticks: [0, 0.25, 0.5, 0.75, 1],
        tickFormat: d => (d * 100) + '%'
      },
      y: { domain: rows.map(r => r.cat), label: null, padding: 0.28 },
      color: { domain: ['Intercepted', 'Got through'], range: [PAL.teal, ORANGE], legend: false },
      marks: [
        Plot.barX(data, Plot.stackX({
          y: 'cat', x: 'frac', fill: 'kind', fillOpacity: 0.82,
          order: ['Intercepted', 'Got through'],
        })),
        Plot.text(labels, {
          y: 'cat', x: () => 1,
          text: 'txt',
          fill: 'currentColor', fillOpacity: 0.7,
          textAnchor: 'start', dx: 12, fontSize: 11
        }),
      ],
    });
    const el = document.getElementById('hs-kyiv-chart');
    el.innerHTML = ''; el.append(chart);
  }
  draw();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
</script>
{% endraw %}
